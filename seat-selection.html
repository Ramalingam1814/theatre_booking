<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Seats — CineBook</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="site-navbar"></div>

<main class="container" style="padding-top:24px;">
  <div id="seat-page-content">
    <div id="show-summary" class="card"></div>

    <div class="two-col">
      <div class="card">
        <h2>Select Your Seats</h2>
        <div class="screen-curve">SCREEN THIS WAY</div>
        <div id="seat-map" class="seat-map"></div>

        <div class="seat-legend">
          <div class="legend-item"><span class="legend-swatch available"></span> Available</div>
          <div class="legend-item"><span class="legend-swatch selected"></span> Selected</div>
          <div class="legend-item"><span class="legend-swatch occupied"></span> Occupied</div>
        </div>
      </div>

      <div class="sticky-col">
        <div class="card">
          <h3>Booking Summary</h3>
          <p><strong>Selected Seats:</strong> <span id="selected-seats-label">No seats selected yet</span></p>
          <div class="summary-box">
            <div class="summary-row"><span>Seats Selected</span><span id="seat-count">0</span></div>
            <div class="summary-row"><span>Ticket Price</span><span id="price-line">—</span></div>
            <div class="summary-row"><span>Convenience Fee</span><span id="fee-line">₹0</span></div>
            <div class="summary-row total"><span>Total Amount</span><span id="total-line">₹0</span></div>
          </div>
          <button id="proceed-checkout-btn" class="btn btn-primary btn-block" style="margin-top:18px;" type="button" disabled>Proceed to Checkout</button>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/seat-selection.js"></script>
</body>
</html>
