<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Details — CineBook</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="site-navbar"></div>

<main class="container" style="padding-top:24px;">
  <div id="movie-details-content"></div>

  <section id="booking" class="card">
    <h2>Book Your Show</h2>

    <h3>1. Select Theatre</h3>
    <div id="theatre-options"></div>

    <h3 style="margin-top:22px;">2. Select Date</h3>
    <div id="date-options" class="pill-group"></div>

    <h3 style="margin-top:22px;">3. Select Show Time</h3>
    <div id="time-options" class="pill-group"></div>

    <button id="proceed-btn" class="btn btn-primary" style="margin-top:26px;" type="button">Book Ticket — Continue to Seat Selection</button>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/movie-details.js"></script>
</body>
</html>
